name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 is the floor declared in package.json; 20 is the current LTS.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # One command, so this file cannot fall behind the test suite again.
      # `npm test` is the single source of truth for what has to pass, and
      # tests/ui.test.js asserts that it names every test file in tests/.
      - name: Full test suite
        run: npm test
