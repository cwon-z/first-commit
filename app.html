<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn Git from zero in an interactive, in-browser sandbox with a live commit graph.">
  <title>First Commit — interactive Git course</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%233ddc84'/%3E%3Crect x='14.75' y='2' width='2.5' height='8' rx='1.25' fill='%233ddc84'/%3E%3Crect x='14.75' y='22' width='2.5' height='8' rx='1.25' fill='%233ddc84'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header id="topbar">
    <button id="menu-btn" aria-label="toggle lesson menu" aria-controls="sidebar" aria-expanded="false">☰</button>
    <a class="brand" href="./index.html" title="back to landing page">
      <span class="brand-dot" aria-hidden="true"></span>
      <span id="brand-name">First Commit</span>
    </a>
    <span id="crumb"></span>
    <div class="progress-wrap" title="course progress">
      <div id="progress-bar"><div id="progress-bar-fill"></div></div>
      <span id="progress-pill">0/0</span>
    </div>
  </header>

  <div id="layout">
    <nav id="sidebar" aria-label="course modules">
      <div id="module-nav"></div>
      <div id="sidebar-foot">
        <button id="reset-progress" class="btn btn-ghost btn-small" type="button">↺ reset my progress</button>
      </div>
    </nav>
    <div id="sidebar-scrim"></div>

    <main id="main">
      <section id="lesson-pane">
        <article id="lesson-article">
          <p class="lesson-p" style="opacity:.6">Loading course…</p>
        </article>
      </section>

      <section id="workspace" class="hidden">
        <div id="exercise-panel"></div>
        <div id="work-grid">
          <div id="terminal-wrap" class="panel">
            <div class="panel-head">
              <span class="panel-title"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span>&nbsp; terminal — simulated git</span>
              <button id="reset-btn" class="btn btn-ghost btn-small" title="restore this exercise's starting state">↺ reset</button>
            </div>
            <div id="terminal" role="log"></div>
          </div>
          <div id="viz-col">
            <div id="graph-panel" class="panel">
              <div class="panel-head">
                <span class="panel-title">commit graph</span>
                <span id="graph-headline"></span>
              </div>
              <div id="graph-scroll"><svg id="graph-svg" role="img" aria-label="commit graph visualization"></svg></div>
              <p id="graph-a11y" class="sr-only" aria-live="polite"></p>
            </div>
            <div id="files-wrap" class="panel">
              <div class="panel-head"><span class="panel-title">file state — the three areas</span></div>
              <div id="files-panel"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./ui/app.js"></script>
</body>
</html>
