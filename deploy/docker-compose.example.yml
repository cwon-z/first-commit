services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - /srv/first-commit/html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Optional accounts backend (Node 22, zero dependencies). Serves ONLY /api/*
  # here — the static course is still served by the nginx replicas above, which
  # is why this has no published port: the lb reaches it on the internal
  # network. Delete this service to run the course static-only.
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server/index.js"]
    user: "1000:1000"
    env_file:
      - ./app.env
    environment:
      PORT: "8000"
      FC_DATA: /data/first-commit.json
    volumes:
      - /srv/first-commit/app:/app:ro
      - /srv/first-commit/data:/data
    networks:
      - web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Internal load balancer that fronts the nginx replicas.
  # Bind to specific private addresses rather than 0.0.0.0 so the stack is
  # only reachable through the reverse proxy and your own network.
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAN_IP}:8084:80"     # private IP your reverse proxy talks to
      - "${VPN_IP}:9008:80"     # optional second bind (VPN, Tailscale, …)
    volumes:
      - ./lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web
    depends_on:
      - web

networks:
  web:
    driver: bridge
