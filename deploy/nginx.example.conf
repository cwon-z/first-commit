worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Trust the forwarded client IP from your reverse proxy only.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format proxied '$remote_addr - $host "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log proxied;

    server {
        listen 80 default_server;
        root /usr/share/nginx/html;
        index index.html;

        # Fonts are content-addressed by name and never change, so they are
        # the only thing safe to freeze.
        location ~* \.woff2?$ {
            # add_header only, so exactly one Cache-Control goes out —
            # "expires" would emit a second, competing one.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else revalidates. "immutable" here was a trap: a browser
        # that had loaded the site once would not re-fetch the JS for a week,
        # not even on a normal reload, so a deploy was invisible to every
        # returning visitor.
        location ~* \.(css|js|json|svg|jpg|jpeg|png|gif|ico)$ {
            expires -1;
        }

        # Health check endpoint for Caddy / the lb
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
